name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # Full gate: ruff format/lint, Pyrefly, import-linter, radon, vulture, pytest (-m "not gl").
      # `adf` tests skip automatically: CI has no disk images (BYOA).
      - name: Quality gate
        run: uv run python scripts/quality_gate.py

      - name: Input diagnostics CLI smoke check
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          uv run harddaysengine-input-diagnostics --version
          uv run harddaysengine-input-diagnostics --help
          uv run harddaysengine-input-diagnostics --no-window --duration 0.05 --output ci_input_diag.jsonl
          uv run python -c "import json, pathlib; p = pathlib.Path('ci_input_diag.jsonl'); lines = [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines()]; assert lines[0]['record_type'] == 'session_start' and lines[-1]['record_type'] == 'session_end'; p.unlink()"
