name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # Full gate: ruff format/lint, mypy, import-linter, radon, vulture, pytest (-m "not gl").
      # `adf` tests skip automatically: CI has no disk images (BYOA).
      - name: Quality gate
        run: uv run python scripts/quality_gate.py
