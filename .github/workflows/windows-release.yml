name: Windows portable release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - run: uv python install
      - run: uv sync --frozen --no-dev
      - name: Build and test the extracted ZIP
        run: uv run --no-sync --with pyinstaller==6.22.3 python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/HardDaysEngine-Windows-x64.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
      - name: Attach ZIP to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          asset=HardDaysEngine-Windows-x64.zip
          if gh release view "$TAG" >/dev/null; then
            gh release upload "$TAG" "$asset"
          else
            gh release create "$TAG" "$asset" --verify-tag --generate-notes --title "HardDaysEngine $TAG"
          fi
